<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reset Your Password</title>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f2937; line-height: 1.5; max-width: 560px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-top: 0; color: #111827;">Reset Your Password</h2>
    <p>Enter the following 6-digit verification code in the FDM System password reset page:</p>
    <div style="margin: 24px 0; padding: 16px; background-color: #f3f4f6; border-radius: 8px; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: 0.35em; color: #111827;">
      {{ .Token }}
    </div>
    <p style="font-size: 14px; color: #4b5563;">
      Alternatively, you can reset your password directly by clicking the link below:
    </p>
    <p style="margin: 16px 0;">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/update-password"
        style="display: inline-block; padding: 10px 18px; background-color: #111827; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600;"
      >
        Reset Password
      </a>
    </p>
    <p style="font-size: 12px; color: #6b7280; margin-top: 24px;">
      If you did not request a password reset, you can safely ignore this email.
    </p>
  </body>
</html>
